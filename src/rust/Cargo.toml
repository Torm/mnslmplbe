[package]
name = 'mnslmplbe'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.65'


[lib]
crate-type = [ "rlib", 'staticlib' ]
name = 'mnslmplbe'


[[bin]]
name = "document"
path = "document.rs"


[dependencies]
statrs = "0.16.0"
dashmap = { version = "5.5.3", features = ["rayon", "inline"] }
rayon = "1.7.0"
parking_lot = { version = "0.12.1", features = [] }
console = { version = "0.15.7", features = [] }
extendr-api = { version = "0.9.0", features = ["ndarray"] }
ndarray = "0.17.2"


[profile.release]
lto = true
codegen-units = 1
